sonar.projectKey=sistemaidbriachofundo-tech_igreja-deus-riacho-fundo-1
sonar.organization=sistemaidbriachofundo-tech
sonar.projectName=igreja-deus-riacho-fundo-1

# Análise de qualidade no monorepo
sonar.sources=apps,packages
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/out/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/prisma/migrations/**,**/public/images/**,**/*.jpg,**/*.jpeg,**/*.png,**/*.webp,**/*.gif

# Coverage: só pacotes com LCOV no CI (API Jest + shared c8).
# Web (Pages estático) e db/prisma não entram na métrica — evitam Zero Coverage diluir o %.
sonar.coverage.exclusions=\
  apps/web/**,\
  packages/db/**,\
  **/prisma/**,\
  **/*.module.ts,\
  **/main.ts,\
  **/jest.config.cjs,\
  **/next.config.*,\
  **/*.config.js,\
  **/*.config.cjs,\
  **/*.config.mjs

# Seed fictício tem blocos de dados repetidos (não é lógica de produção).
sonar.cpd.exclusions=**/prisma/seed.ts,**/prisma/migrations/**

# Relatórios gerados no job SonarCloud (mesmo runner do scan)
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,packages/shared/coverage/lcov.info
sonar.sourceEncoding=UTF-8
