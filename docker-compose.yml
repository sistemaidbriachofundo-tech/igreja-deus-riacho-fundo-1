services:
  postgres:
    image: postgres:16-alpine
    container_name: idbrf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idbrf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idbrf_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-idbrf}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - idbrf_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idbrf} -d ${POSTGRES_DB:-idbrf}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: idbrf-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - idbrf_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  idbrf_pg_data:
  idbrf_redis_data:
