components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiError:
      type: object
      required: [statusCode, message]
      properties:
        statusCode: { type: integer, example: 403 }
        message:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
          example: Sem permissão de secretaria nesta congregação
        error: { type: string, example: Forbidden }
        code: { type: string, example: ADMISSION_STEP_LOCKED }
    AuthGrant:
      type: object
      required: [roleCode]
      properties:
        roleCode:
          type: string
          enum: [PLATFORM_ADMIN, SECRETARIA, PASTOR, TESOURARIA, LIDER_MINISTERIO, MEMBRO]
        organizationId: { type: string, nullable: true }
        churchId: { type: string, nullable: true }
    AuthUser:
      type: object
      required: [userId, personId, email, grants]
      properties:
        userId: { type: string, example: usr_ana_demo }
        personId: { type: string, example: per_ana_demo }
        email: { type: string, format: email, example: ana.demo@example.test }
        grants:
          type: array
          items: { $ref: "#/components/schemas/AuthGrant" }
        organizationId: { type: string, nullable: true, description: Contexto ativo F6 (default RF1) }
        churchId: { type: string, nullable: true, description: Congregação ativa no JWT }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: ana.demo@example.test }
        password: { type: string, format: password, example: admin }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresInSeconds, user]
      properties:
        accessToken: { type: string, example: eyJhbGciOiJIUzI1NiJ9... }
        tokenType: { type: string, enum: [Bearer] }
        expiresInSeconds: { type: integer, example: 3600 }
        user: { $ref: "#/components/schemas/AuthUser" }
        mfa:
          type: object
          description: |
            Hint MFA/OIDC. `challengeRequired=true` indica que a política exige desafio,
            mas o **challenge hard ainda não bloqueia o JWT** neste contrato (FE pode
            orientar enrollment; não há step-up gate). `oidcLive` permanece `false`.
          properties:
            enabled: { type: boolean }
            required: { type: boolean }
            challengeRequired: { type: boolean }
            oidcLive: { type: boolean, enum: [false] }
    PersonSummary:
      type: object
      required: [id, displayName, email, status, householdId]
      properties:
        id: { type: string, example: per_carla_demo }
        displayName: { type: string, example: Carla Demo }
        email: { type: string, nullable: true, example: carla.demo@example.test }
        status: { type: string, example: ACTIVE }
        householdId: { type: string, nullable: true }
        kind: { type: string, enum: [VISITOR, MEMBER] }
        isMinor: { type: boolean }
        legalGuardianPersonId:
          type: string
          nullable: true
          description: Obrigatório quando isMinor=true (detalhe/dossiê)
        photo:
          type: object
          description: Stub RF-001 — presença de foto privada (upload binário fora desta fatia; nunca URL pública)
          properties:
            status: { type: string, enum: [NONE, READY] }
            hasStorageKey: { type: boolean }
    MetaResponse:
      type: object
      required: [app, slug, contractVersion, apiPathPrefix, pilot, endpoints, hmlPublicUrl, notes]
      properties:
        app: { type: string }
        slug: { type: string }
        contractVersion: { type: string, example: 0.7.3-das-etapa3 }
        apiPathPrefix: { type: string }
        pilot: { type: boolean }
        endpoints:
          type: object
          additionalProperties:
            type: string
            enum: [implemented, proposed]
        hmlPublicUrl: { type: string, nullable: true }
        notes:
          type: array
          items: { type: string }
    AuditLogEntry:
      type: object
      required: [id, action, resourceType, resourceId, actorUserId, metadata, createdAt]
      properties:
        id: { type: string }
        action: { type: string }
        resourceType: { type: string }
        resourceId: { type: string, nullable: true }
        actorUserId: { type: string, nullable: true }
        metadata: {}
        createdAt: { type: string, format: date-time }
    AuditLogsResponse:
      type: object
      required: [churchId, logs]
      properties:
        organizationId: { type: string }
        churchId:
          type: string
          nullable: true
          description: Null quando scope=organization (PLATFORM_ADMIN org-wide)
        scope: { type: string, enum: [church, organization] }
        logs:
          type: array
          items: { $ref: "#/components/schemas/AuditLogEntry" }
    Membership:
      type: object
      required: [id, status, joinedAt, notes, person, activeCredentialId]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [PENDING_ADMISSION, ACTIVE, INACTIVE, TRANSFERRED]
          description: PENDING_ADMISSION entra no contrato 0.2 com /admissions
        joinedAt: { type: string, format: date-time }
        notes: { type: string, nullable: true }
        person: { $ref: "#/components/schemas/PersonSummary" }
        activeCredentialId: { type: string, nullable: true }
        admissionId: { type: string, nullable: true }
    MembershipListResponse:
      type: object
      required: [church, memberships]
      properties:
        church:
          type: object
          required: [id, slug, name]
          properties:
            id: { type: string }
            slug: { type: string, example: riacho-fundo-1 }
            name: { type: string, example: Riacho Fundo I }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/Membership" }
    RegisterMembershipRequest:
      type: object
      required: [displayName]
      description: Legado v0.1 — preferir POST /admissions no 0.2
      properties:
        displayName: { type: string, example: Novo Membro Demo }
        email: { type: string, format: email }
        notes: { type: string }
        householdLabel: { type: string }
        personId: { type: string }
    CredentialPdfMeta:
      type: object
      required: [hasFile]
      properties:
        hasFile: { type: boolean }
        contentType: { type: string, nullable: true, example: application/pdf }
        byteSize: { type: integer, nullable: true }
        generatedAt: { type: string, format: date-time, nullable: true }
    MemberCard:
      type: object
      required: [id, status, displayName, churchName, qrPayload, issuedAt, revokedAt, personId, membershipId]
      properties:
        id: { type: string }
        status: { type: string, enum: [ACTIVE, REVOKED] }
        displayName: { type: string, example: Bruno Demo }
        churchName: { type: string, example: Riacho Fundo I }
        qrPayload:
          type: string
          description: Token opaco base64url — único conteúdo do QR (sem CPF/telefone)
          example: xYz9OpaqueTokenDemoOnlyNotPII_
        issuedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }
        personId: { type: string }
        membershipId: { type: string }
        pdf: { $ref: "#/components/schemas/CredentialPdfMeta" }
    MfaStatusResponse:
      type: object
      required: [mfaRequired, totp, oidcLive]
      properties:
        mfaRequired: { type: boolean }
        totp:
          oneOf:
            - type: object
              required: [factorId, status]
              properties:
                factorId: { type: string }
                status: { type: string, enum: [DISABLED, PENDING_ENROLLMENT, ENABLED] }
                label: { type: string, nullable: true }
                verifiedAt: { type: string, format: date-time, nullable: true }
                disabledAt: { type: string, format: date-time, nullable: true }
            - { type: "null" }
        oidcLive: { type: boolean, enum: [false] }
    OidcConfigPublic:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [DISABLED, CONFIGURED, ENABLED] }
        displayName: { type: string, nullable: true }
        issuerUrl: { type: string, nullable: true }
        clientId: { type: string, nullable: true }
        clientSecretRef: { type: string, nullable: true }
        redirectUri: { type: string, nullable: true }
        scopes: { type: string }
        updatedAt: { type: string, format: date-time }
        clientSecret: { type: "null", description: Nunca ecoado }
    CredentialMeResponse:
      type: object
      required: [card, church]
      properties:
        card:
          oneOf:
            - { $ref: "#/components/schemas/MemberCard" }
            - { type: "null" }
        church:
          type: object
          required: [name, slug]
          properties:
            name: { type: string }
            slug: { type: string }
    CredentialVerifyResponse:
      type: object
      required: [status, displayName, churchName, issuedAt, revokedAt]
      properties:
        status: { type: string, enum: [ACTIVE, REVOKED] }
        displayName: { type: string }
        churchName: { type: string }
        issuedAt: { type: string, format: date-time }
        revokedAt: { type: string, format: date-time, nullable: true }
    PersonSearchResponse:
      type: object
      required: [query, hits, autoMergeForbidden]
      properties:
        query: { type: string, example: Carla }
        autoMergeForbidden: { type: boolean, enum: [true] }
        hits:
          type: array
          items:
            type: object
            required: [person, score, matchReasons]
            properties:
              person: { $ref: "#/components/schemas/PersonSummary" }
              score: { type: number, minimum: 0, maximum: 1, example: 0.92 }
              matchReasons:
                type: array
                items:
                  type: string
                  enum: [displayName, email, exactEmail, normalizedDisplayName, tokenOverlap]
    PersonCandidatesRequest:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 2 }
        email: { type: string, format: email }
        limit: { type: integer, minimum: 1, maximum: 50, default: 10 }
    PersonCandidatesResponse:
      type: object
      required: [query, hits, strongMatch, autoMergeForbidden]
      properties:
        query:
          type: object
          required: [displayName, email]
          properties:
            displayName: { type: string }
            email: { type: string, nullable: true }
        hits:
          type: array
          items:
            type: object
            required: [person, score, matchReasons]
            properties:
              person: { $ref: "#/components/schemas/PersonSummary" }
              score: { type: number, minimum: 0, maximum: 1 }
              matchReasons:
                type: array
                items:
                  type: string
                  enum: [displayName, email, exactEmail, normalizedDisplayName, tokenOverlap]
        strongMatch: { type: boolean }
        autoMergeForbidden: { type: boolean, enum: [true] }
    LetterPdfMeta:
      type: object
      required: [hasFile]
      properties:
        hasFile: { type: boolean }
        contentType: { type: string, nullable: true, example: application/pdf }
        byteSize: { type: integer, nullable: true }
        generatedAt: { type: string, format: date-time, nullable: true }
    ChurchLetter:
      type: object
      required: [id, personId, letterType, status, title, bodyText, version, supersedesId, issuedAt, revokedAt, createdAt]
      properties:
        id: { type: string }
        personId: { type: string }
        letterType: { type: string, enum: [TRANSFERENCIA, RECOMENDACAO, MEMBRESIA, OUTRO] }
        status: { type: string, enum: [DRAFT, ISSUED, REVOKED] }
        title: { type: string }
        bodyText: { type: string }
        version: { type: integer }
        supersedesId: { type: string, nullable: true }
        issuedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        pdf: { $ref: "#/components/schemas/LetterPdfMeta" }
    Household:
      type: object
      required: [id, label, churchId, organizationId, memberPersonIds, createdAt]
      properties:
        id: { type: string }
        label: { type: string, nullable: true, example: Família Demo }
        churchId: { type: string }
        organizationId: { type: string }
        memberPersonIds:
          type: array
          items: { type: string }
        members:
          type: array
          items:
            type: object
            required: [id, displayName, isMinor]
            properties:
              id: { type: string }
              displayName: { type: string }
              isMinor: { type: boolean }
        createdAt: { type: string, format: date-time }
    CreateHouseholdRequest:
      type: object
      properties:
        label: { type: string }
        memberPersonIds:
          type: array
          items: { type: string }
    AdmissionChecklist:
      type: object
      required: [modalityRecorded, documentsComplete, secretariaApproved, pastorApproved]
      properties:
        modalityRecorded: { type: boolean }
        documentsComplete: { type: boolean }
        secretariaApproved: { type: boolean }
        pastorApproved: { type: boolean }
    Admission:
      type: object
      required:
        - id
        - personId
        - membershipId
        - status
        - modality
        - currentStep
        - checklist
        - notes
        - createdAt
        - updatedAt
        - credentialEligible
      properties:
        id: { type: string, example: adm_demo_001 }
        personId: { type: string }
        membershipId: { type: string, nullable: true }
        status:
          type: string
          enum:
            - DRAFT
            - AWAITING_DOCUMENTS
            - AWAITING_SECRETARIA
            - AWAITING_PASTOR
            - APPROVED
            - REJECTED
            - CANCELLED
        modality:
          type: string
          nullable: true
          enum: [BATISMO, TRANSFERENCIA, RECONCILIACAO, OUTRO]
        currentStep:
          type: string
          enum: [modality, documents, secretaria, pastor]
        checklist: { $ref: "#/components/schemas/AdmissionChecklist" }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        credentialEligible:
          type: boolean
          description: true somente se status=APPROVED e membresia ACTIVE
    CreateAdmissionRequest:
      type: object
      properties:
        personId: { type: string }
        displayName: { type: string, example: Visitante Demo }
        email: { type: string, format: email }
        householdId: { type: string }
        modality:
          type: string
          enum: [BATISMO, TRANSFERENCIA, RECONCILIACAO, OUTRO]
        notes: { type: string }
    AdvanceAdmissionRequest:
      type: object
      required: [completeStep]
      properties:
        completeStep:
          type: string
          enum: [modality, documents, secretaria, pastor]
        modality:
          type: string
          enum: [BATISMO, TRANSFERENCIA, RECONCILIACAO, OUTRO]
        notes: { type: string }
        decision:
          type: string
          enum: [APPROVE, REJECT]
          description: Obrigatório nas etapas secretaria e pastor
        rejectionReason: { type: string }
    Health:
      type: object
      required: [status, service, timestamp]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        service: { type: string, example: api }
        timestamp: { type: string, format: date-time }
    ViviChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant, system] }
        content: { type: string, maxLength: 2000 }
    ViviChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/ViviChatMessage" }
        consentAiProcessing:
          type: boolean
          description: Obrigatório true em POST /public/vivi/chat (LGPD)
        sessionId: { type: string, nullable: true, maxLength: 128 }
    ViviChatUsage:
      type: object
      required: [inputChars, outputChars, messageCount, latencyMs]
      properties:
        inputChars: { type: integer }
        outputChars: { type: integer }
        messageCount: { type: integer }
        latencyMs: { type: integer }
    ViviKnowledgeSource:
      type: object
      required: [kind, slug, title]
      properties:
        kind: { type: string, enum: [ministry, event, cms] }
        slug: { type: string }
        title: { type: string }
    ViviChatResponse:
      type: object
      required: [reply, provider, model, refused, lgpdNotice, usage]
      properties:
        reply: { type: string }
        provider: { type: string, enum: [manus, gemini, mock] }
        model: { type: string, example: gemini-2.5-flash-lite }
        refused: { type: boolean }
        lgpdNotice: { type: string }
        usage: { $ref: "#/components/schemas/ViviChatUsage" }
        promptVersion: { type: string, description: "Opcional — versão do system prompt institucional" }
        sources:
          type: array
          description: Opcional — fontes oficiais do retrieval estruturado
          items: { $ref: "#/components/schemas/ViviKnowledgeSource" }
        knowledgeMiss:
          type: boolean
          description: Opcional — true quando pedido factual sem dado publicado
    ViviStatus:
      type: object
      required: [assistant, displayName, provider, model, manusUrlConfigured, geminiKeyConfigured, lgpdNotice, notes]
      properties:
        assistant: { type: string, enum: [vivi], description: Alias interno; rotas /vivi/* }
        displayName: { type: string, enum: [Riachinho], description: Nome de produto exibido ao usuário }
        provider: { type: string, enum: [manus, gemini, mock] }
        model: { type: string }
        manusUrlConfigured: { type: boolean }
        geminiKeyConfigured: { type: boolean }
        lgpdNotice: { type: string }
        notes:
          type: array
          items: { type: string }
        promptVersion: { type: string }
        knowledge:
          type: object
          properties:
            mode: { type: string, enum: [structured-cms] }
            ragEnabled: { type: boolean, enum: [false] }
            refreshPolicy: { type: string, enum: [live-db-on-each-request] }

    IndicatorsSummary:
      type: object
      required:
        - stub
        - spiritualScoreExcluded
        - organizationId
        - churchId
        - scope
        - generatedAt
        - counts
      description: |
        Agregações Prisma operacionais (RF-029). Sem métricas espirituais.
        Fórmulas (escopo church = filtro `churchId`; organization = org inteira):
        - membershipsActive = count ChurchMembership status=ACTIVE
        - membershipsPending = count ChurchMembership status=PENDING_ADMISSION
        - visitorsActive = count Person kind=VISITOR status=ACTIVE
          (church: homeChurchId=churchId; org: sem filtro home)
        - admissionsOpen = count AdmissionProtocol status ∈
          {DRAFT,AWAITING_DOCUMENTS,AWAITING_SECRETARIA,AWAITING_PASTOR}
        - transfersOpen = count MembershipTransfer status ∈
          {DRAFT,AWAITING_ORIGIN,AWAITING_DESTINATION}
          (church: fromChurchId OU toChurchId)
        - pastoralOpen = count PastoralCase status ∈ {OPEN,IN_PROGRESS}
          (contagem operacional de casos — **não** score espiritual)
        - ministriesTotal = count Ministry publishStatus ≠ ARCHIVED
        - ministriesPublished = count Ministry publishStatus=PUBLISHED
        - eventsPublished = count PortalEvent status=PUBLISHED
        - eventsPublishedUpcoming = eventsPublished com startsAt ≥ now
        - rostersDraft / rostersPublished = count Roster por status
        - rosterAssignmentsPending = count RosterAssignment status=PENDING
          cujo slot.roster está no escopo
      properties:
        stub: { type: boolean, enum: [false] }
        spiritualScoreExcluded: { type: boolean, enum: [true] }
        organizationId: { type: string }
        churchId: { type: string, nullable: true }
        scope: { type: string, enum: [church, organization] }
        generatedAt: { type: string, format: date-time }
        counts:
          type: object
          required:
            - membershipsActive
            - membershipsPending
            - visitorsActive
            - admissionsOpen
            - transfersOpen
            - pastoralOpen
            - ministriesTotal
            - ministriesPublished
            - eventsPublished
            - eventsPublishedUpcoming
            - rostersDraft
            - rostersPublished
            - rosterAssignmentsPending
          properties:
            membershipsActive: { type: integer, minimum: 0 }
            membershipsPending: { type: integer, minimum: 0 }
            visitorsActive: { type: integer, minimum: 0 }
            admissionsOpen: { type: integer, minimum: 0 }
            transfersOpen: { type: integer, minimum: 0 }
            pastoralOpen: { type: integer, minimum: 0 }
            ministriesTotal: { type: integer, minimum: 0 }
            ministriesPublished: { type: integer, minimum: 0 }
            eventsPublished: { type: integer, minimum: 0 }
            eventsPublishedUpcoming: { type: integer, minimum: 0 }
            rostersDraft: { type: integer, minimum: 0 }
            rostersPublished: { type: integer, minimum: 0 }
            rosterAssignmentsPending: { type: integer, minimum: 0 }

    IndicatorsMembership:
      type: object
      required:
        - stub
        - spiritualScoreExcluded
        - organizationId
        - churchId
        - generatedAt
        - byStatus
      description: |
        Fórmula: `groupBy ChurchMembership.status` com `_count` onde
        organizationId + churchId (grant obrigatório). Sem score espiritual.
      properties:
        stub: { type: boolean, enum: [false] }
        spiritualScoreExcluded: { type: boolean, enum: [true] }
        organizationId: { type: string }
        churchId: { type: string }
        generatedAt: { type: string, format: date-time }
        byStatus:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: Chaves = MembershipStatus (ACTIVE, PENDING_ADMISSION, …)

paths:
  /health:
    get:
      tags: [health]
      x-implementation: implemented
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
              example:
                status: ok
                service: api
                timestamp: "2026-11-04T19:00:00.000Z"

  /auth/login:
    post:
      tags: [auth]
      x-implementation: implemented
      summary: Login demo (JWT)
      description: |
        Seed fictício — senha `admin`. Hash atual SHA-256 demo; alvo DAS Argon2id (módulo IAM).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Token emitido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401":
          description: Credenciais inválidas
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                statusCode: 401
                message: Credenciais inválidas
                error: Unauthorized

  /auth/me:
    get:
      tags: [auth]
      x-implementation: implemented
      summary: Usuário autenticado
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Perfil do token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "401":
          description: Sem token / inválido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /memberships:
    get:
      tags: [memberships]
      x-implementation: implemented
      summary: Lista membresias do piloto RF1
      description: Papéis SECRETARIA ou PLATFORM_ADMIN no escopo da igreja piloto.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MembershipListResponse" }
        "403":
          description: Sem grant de secretaria
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    post:
      tags: [memberships]
      x-implementation: implemented
      summary: Cadastro rápido de membresia (legado v0.1)
      description: |
        Cria pessoa+membresia ACTIVE imediatamente.
        **Contrato 0.2:** FE deve preferir `POST /admissions` (aprovação pastoral antes de ACTIVE/carteirinha).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterMembershipRequest" }
      responses:
        "201":
          description: Membresia criada (API atual pode responder 200)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        "409":
          description: Membresia já existe para personId+church
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /credentials/me:
    get:
      tags: [credentials]
      x-implementation: implemented
      summary: Carteirinha do membro autenticado
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Card ou null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialMeResponse" }
              examples:
                withCard:
                  value:
                    card:
                      id: cred_bruno
                      status: ACTIVE
                      displayName: Bruno Demo
                      churchName: Riacho Fundo I
                      qrPayload: OpaqueTokenDemoOnly_no_PII_abc123
                      issuedAt: "2026-11-04T12:00:00.000Z"
                      revokedAt: null
                      personId: per_bruno_demo
                      membershipId: mem_bruno
                    church: { name: Riacho Fundo I, slug: riacho-fundo-1 }
                withoutCard:
                  value:
                    card: null
                    church: { name: Riacho Fundo I, slug: riacho-fundo-1 }

  /credentials/issue/{membershipId}:
    post:
      tags: [credentials]
      x-implementation: implemented
      summary: Emitir carteirinha (secretaria)
      description: |
        Hoje emite se membresia ACTIVE.
        **Regra DAS 0.2 (a implementar):** recusar se admission não APPROVED (`code: CREDENTIAL_NOT_ELIGIBLE`).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: membershipId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Carteirinha emitida
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberCard" }
        "409":
          description: Já existe carteirinha ativa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /credentials/reissue/{membershipId}:
    post:
      tags: [credentials]
      x-implementation: implemented
      summary: Revogar ativa (se houver) e emitir nova carteirinha
      description: Exige membership ACTIVE + admission APPROVED.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: membershipId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Nova carteirinha
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberCard" }
        "409":
          description: Não elegível
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                statusCode: 409
                message: Carteirinha bloqueada
                code: CREDENTIAL_NOT_ELIGIBLE

  /credentials/revoke/{credentialId}:
    post:
      tags: [credentials]
      x-implementation: implemented
      summary: Revogar carteirinha
      security: [{ bearerAuth: [] }]
      parameters:
        - name: credentialId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Revogada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberCard" }

  /credentials/verify/{opaqueToken}:
    get:
      tags: [credentials]
      x-implementation: implemented
      summary: Validar QR (público mínimo)
      description: Não devolve CPF/telefone; não ecoa o token.
      security: []
      parameters:
        - name: opaqueToken
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Status da carteirinha
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialVerifyResponse" }
        "404":
          description: Token desconhecido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /credentials/{credentialId}/pdf:
    post:
      tags: [credentials]
      x-implementation: implemented
      summary: Gerar PDF real da carteirinha
      description: |
        Pipeline pdfkit + QR opaco. Conteúdo: nome de exibição, igreja, data, QR token.
        **Sem CPF** (campo inexistente no modelo; defesa em profundidade no renderer).
        Arquivo em STORAGE_ROOT privado — sem URL pública.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: credentialId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Card com metadados PDF
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberCard" }
    get:
      tags: [credentials]
      x-implementation: implemented
      summary: Download autenticado do PDF
      security: [{ bearerAuth: [] }]
      parameters:
        - name: credentialId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: application/pdf
          content:
            application/pdf: {}
        "404":
          description: PDF ainda não gerado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /credentials/{credentialId}/pdf-meta:
    get:
      tags: [credentials]
      x-implementation: implemented
      summary: Metadados do PDF (sem bytes)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: credentialId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Meta
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/CredentialPdfMeta" }
                  - type: object
                    properties:
                      credentialId: { type: string }

  /auth/mfa/status:
    get:
      tags: [mfa]
      x-implementation: implemented
      summary: Status MFA do usuário autenticado
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Sem secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaStatusResponse" }

  /auth/mfa/totp/enroll:
    post:
      tags: [mfa]
      x-implementation: implemented
      summary: Iniciar enrollment TOTP
      description: Devolve otpauth URI + secret uma vez. TOTP local — sem IdP.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
      responses:
        "200":
          description: Enrollment pendente
        "409":
          description: TOTP já ENABLED

  /auth/mfa/totp/confirm:
    post:
      tags: [mfa]
      x-implementation: implemented
      summary: Confirmar TOTP com código 6 dígitos
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: "^\\d{6}$" }
      responses:
        "200":
          description: ENABLED

  /auth/mfa/totp/disable:
    post:
      tags: [mfa]
      x-implementation: implemented
      summary: Desabilitar TOTP
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, pattern: "^\\d{6}$" }
      responses:
        "200":
          description: DISABLED

  /auth/oidc/config:
    get:
      tags: [oidc]
      x-implementation: implemented
      summary: Ler config OIDC da org piloto (PLATFORM_ADMIN)
      description: Sem IdP live — só placeholders + env hints. clientSecret nunca ecoado.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Config
    put:
      tags: [oidc]
      x-implementation: implemented
      summary: Upsert config OIDC (PLATFORM_ADMIN)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string }
                issuerUrl: { type: string }
                clientId: { type: string }
                clientSecretRef: { type: string }
                redirectUri: { type: string }
                scopes: { type: string }
                status: { type: string, enum: [DISABLED, CONFIGURED, ENABLED] }
      responses:
        "200":
          description: Config salva (liveIdp=false)
    post:
      tags: [oidc]
      x-implementation: implemented
      summary: Alias POST de upsert config OIDC
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Config salva

  /auth/oidc/authorize:
    get:
      tags: [oidc]
      x-implementation: implemented
      summary: Interface authorize (não live)
      description: Documenta contrato; não redireciona a IdP neste release.
      security: []
      responses:
        "200":
          description: liveIdp=false + requiredEnv

  /auth/oidc/callback:
    get:
      tags: [oidc]
      x-implementation: implemented
      summary: Interface callback (não troca code)
      description: |
        Stub honesto — **não** troca `code` por tokens. Resposta 501 com
        `code: OIDC_NOT_LIVE` até haver IdP autorizado. Sem WABA/banco live neste contrato.
      security: []
      responses:
        "501":
          description: OIDC_NOT_LIVE — IdP não conectado neste release
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode: { type: integer, example: 501 }
                  message:
                    oneOf:
                      - type: string
                      - type: object
                        properties:
                          code: { type: string, enum: [OIDC_NOT_LIVE] }
                          message: { type: string }

  /persons/search:
    get:
      tags: [persons]
      x-implementation: implemented
      summary: Busca para dedupe assistida
      description: Retorna candidatos. **autoMergeForbidden=true** sempre — DAS proíbe merge automático por nome.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Hits
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonSearchResponse" }
              example:
                query: Carla
                autoMergeForbidden: true
                hits:
                  - person:
                      id: per_carla_demo
                      displayName: Carla Demo
                      email: carla.demo@example.test
                      status: ACTIVE
                      householdId: hh_demo
                      kind: VISITOR
                      isMinor: false
                    score: 0.94
                    matchReasons: [displayName, email]

  /persons/candidates:
    post:
      tags: [persons]
      x-implementation: implemented
      summary: Candidatos de duplicidade (pré-admissão)
      description: |
        Ranqueia pessoas existentes por nome/e-mail normalizados.
        **autoMergeForbidden=true** sempre. Se `strongMatch` (exactEmail / nome normalizado),
        o FE deve reutilizar `personId` — não criar visitante novo nem oferecer merge automático.
        Código de admissão relacionado: `PERSON_EMAIL_CANDIDATE` em `POST /admissions` com e-mail já existente.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PersonCandidatesRequest" }
      responses:
        "200":
          description: Candidatos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonCandidatesResponse" }
              example:
                query: { displayName: Carla Demo, email: carla.demo@example.test }
                strongMatch: true
                autoMergeForbidden: true
                hits:
                  - person:
                      id: per_carla_demo
                      displayName: Carla Demo
                      email: carla.demo@example.test
                      status: ACTIVE
                      householdId: hh_demo
                      kind: VISITOR
                      isMinor: false
                      photo: { status: NONE, hasStorageKey: false }
                    score: 0.99
                    matchReasons: [exactEmail, email]

  /persons/{personId}:
    get:
      tags: [persons]
      x-implementation: implemented
      summary: Detalhe de pessoa (escopo org/igreja)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Pessoa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PersonSummary" }
        "404":
          description: Não encontrada no escopo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
    patch:
      tags: [persons]
      x-implementation: implemented
      summary: Atualizar flags de menor / responsável legal / família
      security: [{ bearerAuth: [] }]
      parameters:
        - name: personId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isMinor: { type: boolean }
                legalGuardianPersonId: { type: string, nullable: true }
                householdId: { type: string, nullable: true }
            example:
              isMinor: true
              legalGuardianPersonId: demoPersonRiacho01
      responses:
        "200":
          description: Pessoa atualizada
        "400":
          description: Menor sem guardião ou guardião inválido

  /households:
    get:
      tags: [households]
      x-implementation: implemented
      summary: Listar famílias do piloto
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Lista de famílias
          content:
            application/json:
              schema:
                type: object
                required: [churchId, households]
                properties:
                  churchId: { type: string }
                  households:
                    type: array
                    items: { $ref: "#/components/schemas/Household" }
    post:
      tags: [households]
      x-implementation: implemented
      summary: Criar família (piloto RF1)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateHouseholdRequest" }
      responses:
        "201":
          description: Família criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Household" }

  /households/{householdId}:
    get:
      tags: [households]
      x-implementation: implemented
      summary: Obter família
      security: [{ bearerAuth: [] }]
      parameters:
        - name: householdId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Família
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Household" }

  /admissions:
    get:
      tags: [admissions]
      x-implementation: implemented
      summary: Listar protocolos de admissão
      description: SECRETARIA vê todos do piloto; PASTOR vê pendentes de aprovação pastoral.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum:
              - DRAFT
              - AWAITING_DOCUMENTS
              - AWAITING_SECRETARIA
              - AWAITING_PASTOR
              - APPROVED
              - REJECTED
              - CANCELLED
      responses:
        "200":
          description: Lista
          content:
            application/json:
              schema:
                type: object
                required: [admissions]
                properties:
                  admissions:
                    type: array
                    items: { $ref: "#/components/schemas/Admission" }
    post:
      tags: [admissions]
      x-implementation: implemented
      summary: Abrir protocolo de admissão
      description: |
        Cria pessoa se necessário + membership PENDING_ADMISSION + admission DRAFT/AWAITING_*.
        **Não** emite carteirinha.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAdmissionRequest" }
            example:
              displayName: Visitante Demo
              email: visitante.demo@example.test
              modality: BATISMO
      responses:
        "201":
          description: Protocolo aberto
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Admission" }
              example:
                id: adm_demo_001
                personId: per_visit_demo
                membershipId: mem_pending_001
                status: AWAITING_DOCUMENTS
                modality: BATISMO
                currentStep: documents
                checklist:
                  modalityRecorded: true
                  documentsComplete: false
                  secretariaApproved: false
                  pastorApproved: false
                notes: null
                createdAt: "2026-11-04T15:00:00.000Z"
                updatedAt: "2026-11-04T15:00:00.000Z"
                credentialEligible: false

  /admissions/{admissionId}:
    get:
      tags: [admissions]
      x-implementation: implemented
      summary: Detalhe do protocolo
      security: [{ bearerAuth: [] }]
      parameters:
        - name: admissionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Protocolo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Admission" }

  /admissions/{admissionId}/cancel:
    post:
      tags: [admissions]
      x-implementation: implemented
      summary: Cancelar protocolo em andamento (SECRETARIA)
      description: |
        Status → CANCELLED. Não reabre APPROVED/REJECTED/CANCELLED (`ADMISSION_CLOSED`).
        REJECT via `/advance` permanece para alçadas secretaria/pastor.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: admissionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string }
      responses:
        "200":
          description: Protocolo cancelado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Admission" }
        "409":
          description: Protocolo já encerrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /admissions/{admissionId}/advance:
    post:
      tags: [admissions]
      x-implementation: implemented
      summary: Avançar etapa do checklist (ordem fixa)
      description: |
        Ordem obrigatória: modality → documents → secretaria → pastor.
        - `secretaria` + APPROVE → AWAITING_PASTOR (papel SECRETARIA)
        - `pastor` + APPROVE → APPROVED + membresia ACTIVE + credentialEligible=true (papel PASTOR)
        - REJECT em qualquer alçada → REJECTED (não emite carteirinha)
        Código de erro se pular etapa: `ADMISSION_STEP_LOCKED`
      security: [{ bearerAuth: [] }]
      parameters:
        - name: admissionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdvanceAdmissionRequest" }
            examples:
              secretariaApprove:
                value:
                  completeStep: secretaria
                  decision: APPROVE
                  notes: Documentos conferidos
              pastorApprove:
                value:
                  completeStep: pastor
                  decision: APPROVE
              pastorReject:
                value:
                  completeStep: pastor
                  decision: REJECT
                  rejectionReason: Pendência pastoral (demo)
      responses:
        "200":
          description: Protocolo atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Admission" }
              examples:
                afterPastor:
                  value:
                    id: adm_demo_001
                    personId: per_visit_demo
                    membershipId: mem_pending_001
                    status: APPROVED
                    modality: BATISMO
                    currentStep: pastor
                    checklist:
                      modalityRecorded: true
                      documentsComplete: true
                      secretariaApproved: true
                      pastorApproved: true
                    notes: null
                    createdAt: "2026-11-04T15:00:00.000Z"
                    updatedAt: "2026-11-04T16:00:00.000Z"
                    credentialEligible: true
        "403":
          description: Papel inadequado para a etapa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                statusCode: 403
                message: Aprovação pastoral requer papel PASTOR
                code: ADMISSION_ROLE_REQUIRED
        "409":
          description: Etapa fora de ordem
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
