openapi: 3.1.0
info:
  title: Igreja de Deus Riacho Fundo I — API DAS F1–F6
  version: 0.7.3-rf016
  description: |
    Contrato compartilhado BE ↔ FE (DAS v1.1 + protótipo Central de Membresia v5).
    Dados **fictícios** apenas. Sem deploy de produção neste contrato.

    - `x-implementation: implemented` — disponível na API Nest
    - `x-implementation: proposed` — contrato acordado; backend ainda não entrega (hoje: **0** no mapa F2)
    - 0.2.1–0.2.3: pessoas, famílias, docs, meta, audit, list households
    - 0.3.0-f3: transferências, cartas versionadas, pastoral, discipulado, células, escalas
    - 0.4.0-portal: perfil público Ministry, eventos portal, GET /public/*
    - 0.5.0-portal: CMS workflow + volunteer-interests Atmosfera
    - 0.5.1-pdf-mfa: PDF real da carteirinha (QR opaco, sem CPF) + hooks MFA TOTP / OIDC config (sem IdP live)
    - 0.6.0-f4: núcleo financeiro (plano de contas, lançamentos, dupla aprovação stub, import CSV/OFX stub, conciliação)
    - 0.6.1-channels: F5 canais — outbox WhatsApp/e-mail/push, consentimento, templates,
      delivery status, rate limits, providers mock/noop (sem WABA/SMTP/FCM live; sem IA)
    - 0.7.0-das: multi-igreja (grants/switch), audit org-wide PLATFORM_ADMIN, indicadores stub,
      auth refresh claims (mobile-ready; sem app RN) — consolidado pós-merges DAS
    - 0.7.1-vivi: assistente Vivi/Riachinho (IA) — `POST /public/vivi/chat` (consentimento + rate-limit)
      e `POST /vivi/chat` (staff); providers Manus Forge (default) | Gemini (`GEMINI_API_KEY` só no BE);
      auditoria de uso sem armazenar prompt completo; retrieval estruturado do CMS/portal publicado
      (sem RAG default); campos aditivos opcionais `sources`/`promptVersion`/`knowledgeMiss` (backward-compat)
    - 0.7.2-f2: fechamento F2 — `auth.login` audit, `POST /admissions/:id/cancel`,
      `DELETE /admissions/:id/documents/:documentId`, polish Person/Audit/Meta schemas
    - 0.7.3-das-etapa3: RF-013 transição roster DRAFT→PUBLISHED→CLOSED (publish/close + conflitos);
      RF-018 match/unmatch `BankStatementLine`↔`LedgerEntry`; RF-001 dedupe + RF-006 PDF cartas;
      RF-010 discipleship stages/progress + RF-011 cell frequency report;
      RF-020/021 modalidades, inscrição, check-in e pagamento mock;
      RF-029 indicadores reais — `GET /indicators/*` com `stub: false`;
      RF-023 cursos/EBD/turmas/matrícula/frequência/conclusão (≠ discipulado RF-010);
      RF-009 retenção/export pastoral; RF-030 patrimônio mínimo;
      notes OIDC_NOT_LIVE / MFA challenge
    - 0.7.3-rf016: RF-016…019 — fundos/centros de custo, orçamento + competência/fechamento,
      parser OFX real, PDF_META=META_ONLY (sem OCR), comprovantes em storage privado,
      adapters FILE/MOCK/SICOOB/BRB/CORA sem API bancária live; matching RF-018 reutilizado

    Base URL DEV: `http://localhost:3001` (rotas na **raiz**, sem prefixo `/api`).
    Base HML: **TBD** — só após autorização (ver `docs/hml-runbook.md`).
    Auth: `Authorization: Bearer <accessToken>` salvo no login.
    Constante compartilhada: `API_PATH_PREFIX === ""` (Nest sem `setGlobalPrefix`).
  contact:
    name: Backend IDBRF
servers:
  - url: http://localhost:3001
    description: API Nest local — paths raiz /auth /memberships /credentials (Docker Postgres + seed fictício)
  - url: https://api-hml.example.invalid
    description: Placeholder HML — substituir quando ambiente for autorizado/publicável
tags:
  - name: health
  - name: auth
  - name: mfa
  - name: oidc
