  /admissions/{admissionId}/advance:
    post:
      tags: [admissions]
      x-implementation: implemented
      summary: Avançar etapa do checklist (ordem fixa)
      description: |
        Ordem obrigatória: modality → documents → secretaria → pastor.
        - `secretaria` + APPROVE → AWAITING_PASTOR (papel SECRETARIA)
        - `pastor` + APPROVE → APPROVED + membresia ACTIVE + credentialEligible=true (papel PASTOR)
        - REJECT em qualquer alçada → REJECTED (não emite carteirinha)
        Código de erro se pular etapa: `ADMISSION_STEP_LOCKED`
      security: [{ bearerAuth: [] }]
      parameters:
        - name: admissionId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdvanceAdmissionRequest" }
            examples:
              secretariaApprove:
                value:
                  completeStep: secretaria
                  decision: APPROVE
                  notes: Documentos conferidos
              pastorApprove:
                value:
                  completeStep: pastor
                  decision: APPROVE
              pastorReject:
                value:
                  completeStep: pastor
                  decision: REJECT
                  rejectionReason: Pendência pastoral (demo)
      responses:
        "200":
          description: Protocolo atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Admission" }
              examples:
                afterPastor:
                  value:
                    id: adm_demo_001
                    personId: per_visit_demo
                    membershipId: mem_pending_001
                    status: APPROVED
                    modality: BATISMO
                    currentStep: pastor
                    checklist:
                      modalityRecorded: true
                      documentsComplete: true
                      secretariaApproved: true
                      pastorApproved: true
                    notes: null
                    createdAt: "2026-11-04T15:00:00.000Z"
                    updatedAt: "2026-11-04T16:00:00.000Z"
                    credentialEligible: true
        "403":
          description: Papel inadequado para a etapa
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                statusCode: 403
                message: Aprovação pastoral requer papel PASTOR
                code: ADMISSION_ROLE_REQUIRED
        "409":
          description: Etapa fora de ordem
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
              example:
                statusCode: 409
                message: Etapa pastor bloqueada até secretaria aprovar
                code: ADMISSION_STEP_LOCKED

