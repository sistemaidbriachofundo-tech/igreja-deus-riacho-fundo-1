name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  DATABASE_URL: postgresql://idbrf:idbrf_ci@localhost:5432/idbrf?schema=public
  NEXT_PUBLIC_BASE_PATH: /igreja-deus-riacho-fundo-1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @idbrf/shared
      - run: npx prisma generate --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run build -w @idbrf/db
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @idbrf/shared
      - run: npx prisma generate --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run build -w @idbrf/db
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: idbrf
          POSTGRES_PASSWORD: idbrf_ci
          POSTGRES_DB: idbrf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idbrf -d idbrf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @idbrf/shared
      - run: npx prisma generate --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run build -w @idbrf/db
      - run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @idbrf/shared
      - run: npx prisma generate --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run build -w @idbrf/db
      - run: npm run build -w @idbrf/api
      # next/font/google can flake on Fonts API fetch in CI — retry a few times.
      - name: Build web
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.NEXT_PUBLIC_BASE_PATH }}
        run: |
          for attempt in 1 2 3; do
            if npm run build -w @idbrf/web; then
              exit 0
            fi
            echo "Web build failed (attempt ${attempt}/3); retrying…"
            sleep $((attempt * 5))
          done
          echo "Web build failed after 3 attempts"
          exit 1
      # Preview de revisão: o build exato do PR fica disponível como artefato,
      # sem publicar ou substituir o GitHub Pages da igreja.
      - name: Archive web preview (pull requests only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: church-os-pr-preview
          path: apps/web/out
          if-no-files-found: error
          retention-days: 7
      # Capturas do HTML/CSS compilado. Apenas PRs; não modifica GitHub Pages.
      - name: Capture real portal screenshots (PR only)
        id: portal_screen
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            CHROME="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            CHROME="$(command -v chromium)"
          else
            echo "No Chrome/Chromium binary available"
            exit 1
          fi
          mkdir -p portal-screenshots/host/igreja-deus-riacho-fundo-1
          cp -a apps/web/out/. portal-screenshots/host/igreja-deus-riacho-fundo-1/
          python3 -m http.server 8765 --bind 127.0.0.1 --directory portal-screenshots/host >/tmp/portal-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          URL=http://127.0.0.1:8765/igreja-deus-riacho-fundo-1
          for WIDTH in 1440 768 390; do
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage               --hide-scrollbars --window-size="${WIDTH},1000"               --screenshot="portal-screenshots/home-${WIDTH}.png"               "${URL}/" >/tmp/chrome-portal.log 2>&1 || { cat /tmp/chrome-portal.log; exit 1; }
            test -s "portal-screenshots/home-${WIDTH}.png"
          done
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage             --hide-scrollbars --window-size="390,1000"             --screenshot=portal-screenshots/atmosfera-390.png             "${URL}/ministerios/atmosfera/" >/tmp/chrome-portal.log 2>&1 || { cat /tmp/chrome-portal.log; exit 1; }
          test -s portal-screenshots/atmosfera-390.png
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --window-size="1440,1000" \
            --screenshot=portal-screenshots/ministerios-1440.png \
            "${URL}/ministerios/" >/tmp/chrome-portal.log 2>&1 || { cat /tmp/chrome-portal.log; exit 1; }
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --window-size="1440,1000" \
            --screenshot=portal-screenshots/home-ministerios-1440.png \
            "${URL}/#ministries-title" >/tmp/chrome-portal.log 2>&1 || { cat /tmp/chrome-portal.log; exit 1; }
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --window-size="390,1000" \
            --screenshot=portal-screenshots/agenda-390.png \
            "${URL}/eventos/" >/tmp/chrome-portal.log 2>&1 || { cat /tmp/chrome-portal.log; exit 1; }
          test -s portal-screenshots/ministerios-1440.png
          test -s portal-screenshots/home-ministerios-1440.png
          test -s portal-screenshots/agenda-390.png
          # Capturas estendidas para revisar ritmo e composição abaixo da primeira dobra.
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --window-size="1440,3200" \
            --screenshot=portal-screenshots/home-flow-1440.png \
            "${URL}/" >/tmp/chrome-portal.log 2>&1 || { cat /tmp/chrome-portal.log; exit 1; }
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --window-size="1440,2600" \
            --screenshot=portal-screenshots/ministerios-flow-1440.png \
            "${URL}/ministerios/" >/tmp/chrome-portal.log 2>&1 || { cat /tmp/chrome-portal.log; exit 1; }
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --window-size="390,2500" \
            --screenshot=portal-screenshots/home-flow-390.png \
            "${URL}/" >/tmp/chrome-portal.log 2>&1 || { cat /tmp/chrome-portal.log; exit 1; }
          test -s portal-screenshots/home-flow-1440.png
          test -s portal-screenshots/ministerios-flow-1440.png
          test -s portal-screenshots/home-flow-390.png
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --window-size="390,1200" \
            --screenshot=portal-screenshots/ministerios-390.png \
            "${URL}/ministerios/" >/tmp/chrome-portal.log 2>&1 || { cat /tmp/chrome-portal.log; exit 1; }
          test -s portal-screenshots/ministerios-390.png
          # Capturas da experiência abaixo da primeira dobra.
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --window-size="1440,900" \
            --screenshot=portal-screenshots/primeira-visita-1440.png \
            "${URL}/#primeira-visita" >/tmp/chrome-portal.log 2>&1 || { cat /tmp/chrome-portal.log; exit 1; }
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --window-size="390,920" \
            --screenshot=portal-screenshots/primeira-visita-390.png \
            "${URL}/#primeira-visita" >/tmp/chrome-portal.log 2>&1 || { cat /tmp/chrome-portal.log; exit 1; }
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --window-size="390,920" \
            --screenshot=portal-screenshots/perguntas-390.png \
            "${URL}/contato/#visit-questions-title" >/tmp/chrome-portal.log 2>&1 || { cat /tmp/chrome-portal.log; exit 1; }
          test -s portal-screenshots/primeira-visita-1440.png
          test -s portal-screenshots/primeira-visita-390.png
          test -s portal-screenshots/perguntas-390.png
          # Nova experiência interativa de primeira visita — desktop e celular.
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --window-size="1440,1000" \
            --screenshot=portal-screenshots/planejar-visita-1440.png \
            "${URL}/visita/#planejar" >/tmp/chrome-portal.log 2>&1 || { cat /tmp/chrome-portal.log; exit 1; }
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --hide-scrollbars --window-size="390,1000" \
            --screenshot=portal-screenshots/planejar-visita-390.png \
            "${URL}/visita/#planejar" >/tmp/chrome-portal.log 2>&1 || { cat /tmp/chrome-portal.log; exit 1; }
          test -s portal-screenshots/planejar-visita-1440.png
          test -s portal-screenshots/planejar-visita-390.png
          # Auditoria visual responsiva adicional: celulares compactos, tablet e desktop amplo.
          for WIDTH in 320 360 430 600 1024 1920; do
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --hide-scrollbars --window-size="${WIDTH},900" \
              --screenshot="portal-screenshots/visita-${WIDTH}.png" \
              "${URL}/visita/#planejar" >/tmp/chrome-portal.log 2>&1 || { cat /tmp/chrome-portal.log; exit 1; }
            test -s "portal-screenshots/visita-${WIDTH}.png"
          done
          for WIDTH in 320 430 1024 1920; do
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --hide-scrollbars --window-size="${WIDTH},900" \
              --screenshot="portal-screenshots/home-${WIDTH}.png" \
              "${URL}/" >/tmp/chrome-portal.log 2>&1 || { cat /tmp/chrome-portal.log; exit 1; }
            test -s "portal-screenshots/home-${WIDTH}.png"
          done
          for WIDTH in 320 430 1024; do
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --hide-scrollbars --window-size="${WIDTH},900" \
              --screenshot="portal-screenshots/ministerios-${WIDTH}.png" \
              "${URL}/ministerios/" >/tmp/chrome-portal.log 2>&1 || { cat /tmp/chrome-portal.log; exit 1; }
            test -s "portal-screenshots/ministerios-${WIDTH}.png"
          done
          python3 - <<"PYQA"
          import struct, pathlib
          shots=pathlib.Path("portal-screenshots")
          expected={"visita-320.png":320,"visita-360.png":360,"visita-430.png":430,"visita-600.png":600,"visita-1024.png":1024,"visita-1920.png":1920,"home-320.png":320,"home-430.png":430,"home-1024.png":1024,"home-1920.png":1920,"ministerios-320.png":320,"ministerios-430.png":430,"ministerios-1024.png":1024}
          for name,width in expected.items():
              data=(shots/name).read_bytes()
              actual=struct.unpack(">I",data[16:20])[0]
              if actual!=width: raise SystemExit(f"Unexpected viewport width in {name}: {actual}, expected {width}")
          print(f"Verified {len(expected)} additional viewport screenshots")
          PYQA
          # QA visual para as novas páginas CMS e editorial (sem API real configurada).
          for WIDTH in 320 390 768 1440 1920; do
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --hide-scrollbars --window-size="${WIDTH},1000" \
              --screenshot="portal-screenshots/novidades-${WIDTH}.png" \
              "${URL}/novidades/" >/tmp/chrome-portal.log 2>&1 || { cat /tmp/chrome-portal.log; exit 1; }
            "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
              --hide-scrollbars --window-size="${WIDTH},1000" \
              --screenshot="portal-screenshots/editorial-${WIDTH}.png" \
              "${URL}/app/editorial/" >/tmp/chrome-portal.log 2>&1 || { cat /tmp/chrome-portal.log; exit 1; }
            test -s "portal-screenshots/novidades-${WIDTH}.png"
            test -s "portal-screenshots/editorial-${WIDTH}.png"
          done
          rm -rf portal-screenshots/host
      - name: Archive portal screenshots
        if: github.event_name == 'pull_request' && steps.portal_screen.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: portal-pr-screenshots
          path: portal-screenshots/*.png
          if-no-files-found: error
          retention-days: 7
      # Único caminho de deploy Pages: export estático de apps/web (monorepo).
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: build
    # Secret vive no Environment GitHub "SONAR_TOKEN" (não em repo Actions secrets)
    environment: SONAR_TOKEN
    # Soft: não bloqueia o pipeline se o token ainda não existir
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip when SONAR_TOKEN missing
        id: gate
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN ausente — job Sonar pulado (confira o secret no Environment SONAR_TOKEN)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.skip == 'false'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - if: steps.gate.outputs.skip == 'false'
        run: npm ci
      - name: Build packages for coverage tests
        if: steps.gate.outputs.skip == 'false'
        run: |
          npm run build -w @idbrf/shared
          npx prisma generate --schema packages/db/prisma/schema.prisma
          npm run build -w @idbrf/db
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: API unit tests with coverage (LCOV for Sonar)
        if: steps.gate.outputs.skip == 'false'
        run: npm run test -w @idbrf/api -- --coverage
      - name: Shared unit tests with coverage (LCOV for Sonar)
        if: steps.gate.outputs.skip == 'false'
        run: npm run test:coverage -w @idbrf/shared
      - name: Normalize LCOV paths for Sonar (repo-root relative)
        if: steps.gate.outputs.skip == 'false'
        run: |
          # c8 emite SF:src/... a partir de packages/shared — Sonar precisa do prefixo do monorepo
          sed -i 's|^SF:src/|SF:packages/shared/src/|' packages/shared/coverage/lcov.info
          # defensivo: se algum SF absoluto do runner aparecer, corta até o repo
          for f in apps/api/coverage/lcov.info packages/shared/coverage/lcov.info; do
            sed -i "s|^SF:${GITHUB_WORKSPACE}/|SF:|" "$f"
          done
          test -s apps/api/coverage/lcov.info
          test -s packages/shared/coverage/lcov.info
          echo "LCOV sample (api):"; grep -m3 '^SF:' apps/api/coverage/lcov.info || true
          echo "LCOV sample (shared):"; grep -m3 '^SF:' packages/shared/coverage/lcov.info || true
      - name: SonarCloud Scan
        if: steps.gate.outputs.skip == 'false'
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Deploy Pages somente via este job (não há workflow nextjs.yml separado).
  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
