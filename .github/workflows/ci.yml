name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  DATABASE_URL: postgresql://idbrf:idbrf_ci@localhost:5432/idbrf?schema=public
  NEXT_PUBLIC_BASE_PATH: /igreja-deus-riacho-fundo-1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @idbrf/shared
      - run: npx prisma generate --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run build -w @idbrf/db
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @idbrf/shared
      - run: npx prisma generate --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run build -w @idbrf/db
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: idbrf
          POSTGRES_PASSWORD: idbrf_ci
          POSTGRES_DB: idbrf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idbrf -d idbrf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @idbrf/shared
      - run: npx prisma generate --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run build -w @idbrf/db
      - run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @idbrf/shared
      - run: npx prisma generate --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run build -w @idbrf/db
      - run: npm run build -w @idbrf/api
      - run: npm run build -w @idbrf/web
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.NEXT_PUBLIC_BASE_PATH }}
      # Único caminho de deploy Pages: export estático de apps/web (monorepo).
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: build
    # Secret vive no Environment GitHub "SONAR_TOKEN" (não em repo Actions secrets)
    environment: SONAR_TOKEN
    # Soft: não bloqueia o pipeline se o token ainda não existir
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip when SONAR_TOKEN missing
        id: gate
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "SONAR_TOKEN ausente — job Sonar pulado (confira o secret no Environment SONAR_TOKEN)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - if: steps.gate.outputs.skip == 'false'
        run: npm ci
      - name: Build packages for coverage tests
        if: steps.gate.outputs.skip == 'false'
        run: |
          npm run build -w @idbrf/shared
          npx prisma generate --schema packages/db/prisma/schema.prisma
          npm run build -w @idbrf/db
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: API unit tests with coverage (LCOV for Sonar)
        if: steps.gate.outputs.skip == 'false'
        run: npm run test -w @idbrf/api -- --coverage --coverageReporters=lcov --coverageReporters=text-summary
      - name: SonarCloud Scan
        if: steps.gate.outputs.skip == 'false'
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Deploy Pages somente via este job (não há workflow nextjs.yml separado).
  deploy-pages:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
