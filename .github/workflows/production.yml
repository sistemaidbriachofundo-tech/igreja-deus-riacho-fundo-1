name: Production

# Trilho de produção — NÃO publica DNS nem corta tráfego sozinho.
# Fluxo: PR → production (CI+Sonar hard) → push em production → Environment "production"
# (aprovação manual) → artefatos. Deploy Hostinger e preflight seguem o checklist.

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Digite DEPLOY para liberar o job de artefato/deploy (ainda exige Environment production)
        required: true
        default: "NO"

permissions:
  contents: read
  checks: write
  pull-requests: read

concurrency:
  group: production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  DATABASE_URL: postgresql://idbrf:idbrf_ci@localhost:5432/idbrf?schema=public
  # Domínio apex Hostinger — sem basePath do GitHub Pages
  NEXT_PUBLIC_BASE_PATH: ""

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @idbrf/shared
      - run: npx prisma generate --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run build -w @idbrf/db
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @idbrf/shared
      - run: npx prisma generate --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run build -w @idbrf/db
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: idbrf
          POSTGRES_PASSWORD: idbrf_ci
          POSTGRES_DB: idbrf
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U idbrf -d idbrf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @idbrf/shared
      - run: npx prisma generate --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run build -w @idbrf/db
      - name: Recusar migração fora do Postgres local de CI
        run: node scripts/release/assert-local-database.mjs
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npx prisma migrate deploy --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run test

  build:
    name: Build (candidato produção)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build -w @idbrf/shared
      - run: npx prisma generate --schema packages/db/prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: npm run build -w @idbrf/db
      - run: npm run build -w @idbrf/api
      - name: Build web (apex / API de produção)
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.NEXT_PUBLIC_BASE_PATH }}
          NEXT_PUBLIC_HML_ENABLED: "false"
          NEXT_PUBLIC_ADMIN_PRODUCTION: "true"
          NEXT_PUBLIC_RIACHINHO_PUBLIC_ENABLED: "true"
          NEXT_PUBLIC_PORTAL_LIVE_ENABLED: "false"
          NEXT_PUBLIC_API_URL: ${{ vars.PRODUCTION_API_URL || 'https://api.igrejadeusrf1.com.br' }}
        run: |
          if [ "${NEXT_PUBLIC_API_URL}" != "https://api.igrejadeusrf1.com.br" ]; then
            echo "::error::O painel de produção exige a API oficial https://api.igrejadeusrf1.com.br."
            exit 1
          fi
          for attempt in 1 2 3; do
            if npm run build -w @idbrf/web; then
              exit 0
            fi
            echo "Web build failed (attempt ${attempt}/3); retrying…"
            sleep $((attempt * 5))
          done
          echo "Web build failed after 3 attempts"
          exit 1
      - name: Manifesto do candidato
        env:
          PRODUCTION_API_ORIGIN: ${{ vars.PRODUCTION_API_URL || 'https://api.igrejadeusrf1.com.br' }}
        run: |
          mkdir -p dist/prod
          printf '%s\n' "{
            \"channel\": \"production-candidate\",
            \"sourceSha\": \"${GITHUB_SHA}\",
            \"ref\": \"${GITHUB_REF_NAME}\",
            \"builtAt\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
            \"phase\": \"CANDIDATE\",
            \"dnsCutover\": false
          }" > dist/prod/release.json
          cp -a apps/web/out dist/prod/web-out
          printf '%s\n' "{
            \"channel\": \"production\",
            \"sourceSha\": \"${GITHUB_SHA}\",
            \"phase\": \"EM_EXECUCAO\",
            \"officialUrl\": \"https://igrejadeusrf1.com.br\",
            \"apiOrigin\": \"${PRODUCTION_API_ORIGIN}\"
          }" > dist/prod/web-out/release.json
          mkdir -p dist/prod/api
          cp -a apps/api/dist dist/prod/api/dist
          cp -a apps/api/package.json dist/prod/api/package.json
      - uses: actions/upload-artifact@v4
        with:
          name: production-candidate-${{ github.sha }}
          path: dist/prod
          if-no-files-found: error
          retention-days: 14

  security:
    name: Segurança F1.1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node scripts/release/secret-scan.mjs
      - run: node scripts/release/assert-local-database.mjs
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - run: node --import tsx --test packages/shared/src/security-f11/security-f11.test.ts
      - run: node --test qa/security-f11/src/qa-api-smoke.test.mjs
      - name: Audit de produção (high+)
        run: npm audit --omit=dev --audit-level=high

  sonar:
    name: SonarCloud (gate produção)
    runs-on: ubuntu-latest
    needs: [build, security]
    # Hard gate — sem continue-on-error. Token no Environment GitHub "SONAR_TOKEN".
    environment: SONAR_TOKEN
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Exigir SONAR_TOKEN
        id: gate
        run: |
          if [ -z "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "::error::SONAR_TOKEN ausente no Environment SONAR_TOKEN — pipeline de produção bloqueada."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build packages for coverage
        run: |
          npm run build -w @idbrf/shared
          npx prisma generate --schema packages/db/prisma/schema.prisma
          npm run build -w @idbrf/db
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
      - name: Coverage API
        run: npm run test -w @idbrf/api -- --coverage
      - name: Coverage shared
        run: npm run test:coverage -w @idbrf/shared
      - name: Normalize LCOV paths
        run: |
          sed -i 's|^SF:src/|SF:packages/shared/src/|' packages/shared/coverage/lcov.info
          for f in apps/api/coverage/lcov.info packages/shared/coverage/lcov.info; do
            sed -i "s|^SF:${GITHUB_WORKSPACE}/|SF:|" "$f"
          done
          test -s apps/api/coverage/lcov.info
          test -s packages/shared/coverage/lcov.info
      - name: SonarCloud Scan + Quality Gate
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.branch.name=${{ github.head_ref || github.ref_name }}

  promote-ready:
    name: Candidato pronto (sem DNS)
    runs-on: ubuntu-latest
    needs: [sonar, build, security]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_deploy == 'DEPLOY')
    environment:
      name: production
      url: https://igrejadeusrf1.com.br
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: production-candidate-${{ github.sha }}
          path: dist/prod
      - name: Registrar candidato (não corta DNS)
        run: |
          echo "SHA candidato: ${GITHUB_SHA}"
          echo "Artefato production-candidate pronto."
          echo "Próximo passo humano: docs/prod-pipeline.md + deploy/prod/secrets-checklist.md"
          echo "Este job NÃO altera DNS, Traefik nem Unlimited."
          test -f dist/prod/release.json
          cat dist/prod/release.json
      - name: Registrar verificação pós-deploy
        run: echo "Após publicar a API candidata, execute npm run release:preflight com o SHA publicado."
