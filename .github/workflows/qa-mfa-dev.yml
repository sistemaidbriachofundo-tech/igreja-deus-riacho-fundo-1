name: QA isolada — Login MFA DEV e oito personas
on:
  push:
    branches:
      - chatgpt/f11-mfa-dev-qa-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mfa-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://idbrf:idbrf_ci@localhost:5432/idbrf?schema=public
      NEXT_PUBLIC_BASE_PATH: /igreja-deus-riacho-fundo-1
      NEXT_PUBLIC_HML_ENABLED: "false"
      NEXT_PUBLIC_API_URL: https://id-riacho1-api-qa.vercel.app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build -w @idbrf/shared
      - run: npx prisma generate --schema packages/db/prisma/schema.prisma
      - run: npm run build -w @idbrf/db
      - name: Checagem de tipos web e API
        run: |
          npm run typecheck -w @idbrf/api
          npm run typecheck -w @idbrf/web
      - name: Testes de MFA e acesso web
        run: |
          npm run test -w @idbrf/web
          node --test qa/security-f11/src/eight-personas-e2e.test.mjs
      - name: Testes unitários da autenticação backend
        run: npm run test -w @idbrf/api -- --runInBand --testPathPatterns=auth
      - name: Build frontend em modo HML
        env:
          NEXT_PUBLIC_HML_ENABLED: "true"
        run: npm run build -w @idbrf/web
