name: Android APK DEV (ID Riacho 1)

on:
  push:
    branches:
      - feature/mobile-capacitor-foundation-20261123
    paths:
      - "mobile/**"
      - "apps/web/**"
      - "packages/shared/**"
      - ".github/workflows/mobile-apk-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_debug:
    name: Compilar APK de testes (HML, sem produção)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://idbrf:idbrf_ci@localhost:5432/idbrf?schema=public
      NEXT_PUBLIC_API_URL: https://id-riacho1-api-hml.vercel.app
      NEXT_PUBLIC_HML_ENABLED: "true"
      NEXT_PUBLIC_ADMIN_PRODUCTION: "false"
      NEXT_PUBLIC_PORTAL_LIVE_ENABLED: "false"
      NEXT_PUBLIC_RIACHINHO_PUBLIC_ENABLED: "false"
      NEXT_PUBLIC_SITE_LAYOUT_LIVE_ENABLED: "false"
      NEXT_PUBLIC_BASE_PATH: ""
      IDBRF_STATIC_APEX: "1"
    steps:
      - name: Código da branch de DEV
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Java 21 para Capacitor Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Instalar dependências do sistema web
        run: npm ci

      - name: Compilar dependências compartilhadas
        run: |
          npm run build -w @idbrf/shared
          npx prisma generate --schema packages/db/prisma/schema.prisma
          npm run build -w @idbrf/db

      - name: Gerar frontend estático conectado apenas à API HML
        run: npm run build -w @idbrf/web

      - name: Validar frontend gerado
        run: node mobile/scripts/verify-web-build.mjs

      - name: Instalar Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Preparar projeto Android
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android

      - name: Gerar APK debug instalável
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verificar APK e emitir checksum
        run: |
          test -s mobile/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l mobile/android/app/build/outputs/apk/debug/app-debug.apk | grep -F "assets/public/index.html"
          sha256sum mobile/android/app/build/outputs/apk/debug/app-debug.apk | tee mobile/android/app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Disponibilizar APK de testes
        uses: actions/upload-artifact@v4
        with:
          name: id-riacho1-android-hml-debug
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
